# Placeholder URI keeps the context loadable without a cluster; the driver
# connects lazily and integration tests override this from the container.
spring.mongodb.uri=mongodb://localhost:27017/accountflow-test
spring.mongodb.database=accountflow-test

# No live cluster in tests.
accountflow.mongo.startup-check=false

# Test-only signing key. Never reuse outside tests.
accountflow.jwt.secret=test-secret-key-for-unit-tests-only-not-for-production-use-0123456789
accountflow.jwt.access-token-ttl=15m
accountflow.jwt.refresh-token-ttl=7d

# The driver's background monitor dials the placeholder host once and logs a
# stack trace; it is harmless, so keep it out of the test output.
logging.level.org.mongodb.driver.cluster=OFF
logging.level.org.mongodb.driver.client=OFF
