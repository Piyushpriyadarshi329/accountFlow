spring.application.name=AccountFlow

# Loads .env if present (gitignored); real environment variables still win,
# so CI and production need no file.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# MongoDB
# Note the prefix: Spring Boot 4 moved these from spring.data.mongodb.* to
# spring.mongodb.*. The old keys are deprecated at level=error, so they bind to
# nothing and the driver quietly falls back to localhost:27017.
# ---------------------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI}
# MongoDB rejects two database names differing only by case, so the exact
# spelling matters: this cluster already holds "AccountFlow".
spring.mongodb.database=${MONGODB_DATABASE:AccountFlow}

# Still lives under the old prefix (spring-boot-data-mongodb, not spring-boot-mongodb).
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# Security. No default secret on purpose: a fallback here is a production
# vulnerability waiting for someone to forget the override.
# Generate one with: openssl rand -base64 48
# ---------------------------------------------------------------------------
accountflow.jwt.secret=${JWT_SECRET}
accountflow.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
accountflow.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:7d}
accountflow.jwt.issuer=accountflow

# ---------------------------------------------------------------------------
# Web
# ---------------------------------------------------------------------------
# Render (and most PaaS) assign a port and inject it as PORT; a service that
# ignores it never receives traffic. Falls back to SERVER_PORT locally, then to
# 8082 - not Spring's usual 8080, which another app on this machine uses.
server.port=${PORT:${SERVER_PORT:8082}}
spring.jackson.default-property-inclusion=non_null
# Jackson 3 (Boot 4) already writes dates as ISO-8601 by default, and moved
# WRITE_DATES_AS_TIMESTAMPS off SerializationFeature, so the old property no
# longer binds.
# Cap request bodies; an unbounded body is a cheap denial-of-service.
spring.servlet.multipart.max-request-size=1MB
server.max-http-request-header-size=16KB

# Never leak internals through the default error page.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.pattern.level=%5p [requestId=%X{requestId:-} userId=%X{userId:-}]

# Browser origins allowed to call the API (the Expo web build). Native apps are
# not browsers and ignore CORS, so this only affects the web target.
accountflow.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}

# ---------------------------------------------------------------------------
# Health, for the platform's health check. Only /health is exposed, and it
# reports status alone - component detail would leak the database host.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
